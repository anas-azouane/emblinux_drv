# ============================================================
#  Yocto build configuration - STM32MP157D-DK1
# ============================================================
# This file is YOUR machine's build settings. It is not version
# controlled by any layer; anything here overrides layer defaults.
# See ../layers/poky/meta-poky/conf/templates/default/local.conf.sample
# for the full annotated original.

# --- What to build for --------------------------------------
# Defined in ../layers/meta-dk1/conf/machine/stm32mp157d-dk1.conf
MACHINE ?= "stm32mp157d-dk1"

# The distro policy layer: what init system, what C library, what
# features are globally on. "poky" is the reference distro.
DISTRO ?= "poky"

# --- Shared state and downloads -----------------------------
# Kept OUTSIDE build/ so you can delete build/tmp and rebuild in
# minutes instead of hours. DL_DIR holds fetched source tarballs;
# SSTATE_DIR holds cached build output keyed by input hash.
DL_DIR ?= "/home/debext/yoctotst/downloads"
SSTATE_DIR ?= "/home/debext/yoctotst/sstate-cache"

# --- Parallelism (tuned for your 8-core / 15 GB box) --------
# These MULTIPLY: BB_NUMBER_THREADS recipes at once, each running
# PARALLEL_MAKE compiler jobs. 8 x 8 = up to 64 concurrent jobs, which
# exhausted 15 GB of RAM when rust-native landed on top of do_rootfs.
# 4 x 4 = 16 is the safe ceiling for this box. Yocto wants roughly
# 2 GB of RAM per concurrent job.
BB_NUMBER_THREADS ?= "4"
PARALLEL_MAKE ?= "-j 4"

# Belt and braces: pressure regulation. BitBake reads the kernel's PSI
# counters (/proc/pressure/*) and stops launching NEW tasks while stall
# time exceeds these thresholds, in microseconds of stall per second.
# Running tasks are never killed, so this throttles instead of failing.
BB_PRESSURE_MAX_MEMORY ?= "5000"
BB_PRESSURE_MAX_IO ?= "5000"

# --- Packaging ----------------------------------------------
# ipk is the lightest of the three package backends; also rpm, deb.
PACKAGE_CLASSES ?= "package_ipk"

# --- Image features -----------------------------------------
# debug-tweaks = empty root password + serial console login.
# Fine for a dev board. REMOVE THIS for anything shipping.
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# Handy extras on the target: ssh, dev tools, package manager.
# IMAGE_FEATURES += "ssh-server-dropbear tools-debug package-management"

# --- Build-time conveniences --------------------------------
USER_CLASSES ?= "buildstats"

# Warn/abort when the build disk gets low, instead of failing weirdly.
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

# --- Optional -----------------------------------------------
# ST's GPU/VPU blobs are under a click-through licence. Uncomment to
# accept it; only needed for graphics images, not core-image-minimal.
# ACCEPT_EULA_stm32mp157d-dk1 = "1"

# Delete each recipe's work directory after it builds. Saves ~50 GB,
# but makes debugging harder because the sources are gone.
# INHERIT += "rm_work"

CONF_VERSION = "2"
