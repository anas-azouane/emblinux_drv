# Tell BitBake where to find things inside this layer.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Every layer needs a unique collection name.
BBFILE_COLLECTIONS += "dk1"
BBFILE_PATTERN_dk1 = "^${LAYERDIR}/"
# Higher priority than meta-st-stm32mp (6), so our .bbappends win.
BBFILE_PRIORITY_dk1 = "10"

# Refuse to parse if these layers are missing.
LAYERDEPENDS_dk1 = "core stm-st-stm32mp"
# Refuse to parse against the wrong Yocto release.
LAYERSERIES_COMPAT_dk1 = "scarthgap"
