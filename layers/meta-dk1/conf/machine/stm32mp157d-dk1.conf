#@TYPE: Machine
#@NAME: stm32mp157d-dk1
#@DESCRIPTION: STMicroelectronics STM32MP157D-DK1 Discovery kit

# Start from ST's reference machine and change only what differs.
# stm32mp15-disco targets the STM32MP157F-DK2: same SoC family, but that
# board adds a 4" DSI panel and a BCM43xx Wi-Fi/BT module. The DK1 has
# neither, and needs its own device tree.
require conf/machine/stm32mp15-disco.conf

# --- Device tree -----------------------------------------------------
# Plain "=" (not "+=") so we REPLACE the DK2 list instead of adding to it.
# This name drives TF-A, U-Boot, the kernel DTB and the extlinux entry.
STM32MP_DT_FILES_SDCARD = "stm32mp157d-dk1"
LINUX_A7_EXAMPLES_DT = "stm32mp157d-dk1-a7-examples"
CUBE_M4_EXAMPLES_DT = "stm32mp157d-dk1-m4-examples"
M4_BOARDS = "STM32MP157D-DK1"
ST_OPTEE_EXPORT_TA_REF_BOARD:stm32mp1common = "stm32mp157d-dk1.dts"

# --- Machine features ------------------------------------------------
# No Wi-Fi/BT module on the DK1, so don't drag in its firmware.
MACHINE_FEATURES:remove = "bluetooth"
MACHINE_FEATURES:remove = "wifi"

# --- SD card image ---------------------------------------------------
# Ask for a .wic (a full, dd-able SD card image) plus a .bmap for fast flashing.
WKS_IMAGE_FSTYPES = "wic wic.bmap"
WKS_FILE = "sdcard-stm32mp157d-dk1.wks.in"

